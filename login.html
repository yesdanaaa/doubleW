<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - Log In</title>

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Подключаем переводы и менеджер языка -->
  <script src="translations.js"></script>
  <script src="language.js"></script>
  <script src="language-switcher.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to bottom, #eff6ff, #f0fdfa, #ecfdf5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1f2937;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }

    .slogan {
      font-size: 1.1rem;
      color: #15803d;
      letter-spacing: 1px;
      font-weight: 500;
      margin: 0 0 40px 0;
      text-align: center;
      width: 100%;
      opacity: 0;
      animation: fadeIn 1.2s forwards 0.4s;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .form-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      border: 1px solid #d1fae5;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.8s forwards 0.6s;
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 2.25rem;
      color: #065f46;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #4b5563;
      text-align: center;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }
    .checkbox-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      accent-color: #16a34a;
    }
    .forgot-link {
      color: #16a34a;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #15803d;
    }
    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: #4b5563;
    }
    .signup-link a {
      color: #16a34a;
      text-decoration: none;
      font-weight: 500;
    }
    .signup-link a:hover {
      text-decoration: underline;
    }
    .info-text {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 1s forwards 1.2s;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <p class="slogan" id="slogan">Save water. Save world.</p>

    <div class="form-card">
      <h1 id="title">Welcome Back</h1>
      <p class="subtitle" id="subtitle">Log in to manage your irrigation efficiently</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" id="emailLabel">Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" id="passwordLabel">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span id="rememberText">Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgotText">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn">Log In</button>
      </form>

      <div class="signup-link">
        <span id="noAccountText">Don't have an account?</span> 
        <a href="index.html" id="signupLink">Sign up</a>
      </div>
    </div>

    <p class="info-text" id="infoText">
      By logging in, you agree to our smart irrigation practices<br>for a more sustainable future
    </p>
  </div>

<script>
const API_BASE = 'https://doublew.onrender.com';
const form = document.getElementById('loginForm');

// Функция обновления переводов
function updatePageTranslations() {
  document.getElementById('slogan').textContent = __('saveWater');
  document.getElementById('title').textContent = __('login.title');
  document.getElementById('subtitle').textContent = __('login.subtitle');
  document.getElementById('emailLabel').textContent = __('login.email');
  document.getElementById('passwordLabel').textContent = __('login.password');
  document.getElementById('rememberText').textContent = __('login.remember');
  document.getElementById('forgotText').textContent = __('login.forgot');
  document.getElementById('loginBtn').textContent = __('login.login');
  document.getElementById('noAccountText').textContent = __('login.noAccount');
  document.getElementById('signupLink').textContent = __('login.signUp');
  document.getElementById('infoText').innerHTML = __('login.info');
}

// Подписываемся на изменения языка
if (window.langManager) {
  window.langManager.subscribe(updatePageTranslations);
}

// Загружаем переводы при загрузке страницы
document.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('appLanguage') || 'en';
  if (window.langManager) {
    window.langManager.setLanguage(savedLang);
  } else {
    updatePageTranslations();
  }
});

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!email || !password) {
    alert(__('login.fillFields') || 'Please fill in email and password');
    return;
  }

  const submitBtn = form.querySelector('.submit-btn');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = __('login.loggingIn') || 'Logging in...';

  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (response.ok) {
      // Сохраняем токены и email
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('userEmail', email);
      localStorage.setItem('userName', data.user.name);

      alert(__('login.success') || 'Login successful!');
      window.location.href = 'frontend.html';
    } else {
      alert(data.message || (__('login.invalid') || 'Invalid email or password'));
    }
  } catch (error) {
    console.error('Error:', error);
    alert(__('login.connectionError') || 'Could not connect to server');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
  }
});
</script>

</body>
</html>
